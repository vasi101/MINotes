name: Release Mi Notes

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  validate-release:
    name: Validate release and run checks
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate release version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          lock_version=$(node -p "require('./package-lock.json').version")
          tauri_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo_version=$(awk -F '"' '/^version = / {print $2; exit}' src-tauri/Cargo.toml)
          if [[ "$RELEASE_TAG" != "v$version" || "$lock_version" != "$version" || "$tauri_version" != "$version" || "$cargo_version" != "$version" ]]; then
            echo "Tag, package.json, package-lock.json, Cargo.toml, and tauri.conf.json versions must match." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Check drawing geometry and PDF export
        run: |
          node tests/shapes.unit.mjs
          node tests/ink.unit.mjs
          node tests/move.unit.mjs

  build:
    name: Build ${{ matrix.label }}
    needs: validate-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            label: Windows x64
            os: windows-2022
            bundles: nsis,msi
          - platform: linux-x64
            label: Linux x64
            os: ubuntu-22.04
            bundles: deb,appimage
          - platform: macos-arm64
            label: macOS Apple Silicon
            os: macos-14
            bundles: dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev libfuse2 libgtk-3-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf librsvg2-dev wget

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        env:
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        shell: bash
        run: |
          if [[ -z "$GOOGLE_DESKTOP_CLIENT_ID" || -z "$GOOGLE_DESKTOP_CLIENT_SECRET" ]]; then
            echo "Set GOOGLE_DESKTOP_CLIENT_ID and GOOGLE_DESKTOP_CLIENT_SECRET repository secrets before releasing." >&2
            exit 1
          fi
          npm run tauri -- build --bundles "${{ matrix.bundles }}"

      - name: Collect installers and checksums
        run: node scripts/collect-release-assets.mjs

      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Notes-${{ env.RELEASE_TAG }}-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download installers from all platforms
        uses: actions/download-artifact@v4
        with:
          pattern: Mi-Notes-${{ env.RELEASE_TAG }}-*
          path: release-assets
          merge-multiple: true

      - name: Create combined checksums
        run: |
          cd release-assets
          rm -f SHA256SUMS.txt
          sha256sum * | sort -k2 > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Mi Notes ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          fail_on_unmatched_files: true
          body: |
            Installers are provided for Windows x64, Linux x64, and macOS Apple Silicon (ARM64).

            macOS builds are unsigned and may require approval in Privacy & Security before opening.
            Windows installers are not code-signed. SHA256SUMS.txt contains checksums for every installer.
          files: release-assets/*
