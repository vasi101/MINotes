name: Release Mi Notes

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-windows:
    name: Build Windows installers
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri installers
        run: npm run tauri build

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Mi Notes ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/Mi Notes_*_x64-setup.exe
            src-tauri/target/release/bundle/msi/Mi Notes_*_x64_en-US.msi
