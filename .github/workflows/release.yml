name: Release Mi Notes

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-windows:
    name: Build Windows installers
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Validate release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = Get-Content src-tauri/Cargo.toml -Raw
          $cargoVersion = [regex]::Match($cargo, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if ($env:RELEASE_TAG -ne "v$version" -or $tauriVersion -ne $version -or $cargoVersion -ne $version) {
            throw "Tag, package.json, Cargo.toml, and tauri.conf.json versions must match."
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install dependencies
        run: npm ci

      - name: Check drawing geometry and PDF export
        shell: pwsh
        run: |
          node tests/shapes.unit.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/ink.unit.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/move.unit.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Tauri installers
        env:
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_DESKTOP_CLIENT_ID) -or [string]::IsNullOrWhiteSpace($env:GOOGLE_DESKTOP_CLIENT_SECRET)) {
            throw "Set GOOGLE_DESKTOP_CLIENT_ID and GOOGLE_DESKTOP_CLIENT_SECRET repository secrets before releasing."
          }
          npm run tauri -- build --bundles nsis,msi -- --locked

      - name: Collect installers and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          $exe = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          $msi = @(Get-ChildItem src-tauri/target/release/bundle/msi/*.msi)
          if ($exe.Count -eq 0 -or $msi.Count -eq 0) { throw "Missing Windows installers." }
          @($exe + $msi) | Copy-Item -Destination release-assets
          Get-ChildItem release-assets -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content release-assets/SHA256SUMS.txt -Encoding utf8

      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Notes-${{ env.RELEASE_TAG }}-windows-x64
          path: release-assets/*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Mi Notes ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          fail_on_unmatched_files: true
          body: |
            Windows x64 installers. Download the setup.exe for a standard installation, or the .msi for managed installation.

            These installers are not code-signed. A Windows signing certificate has not yet been configured.
            SHA256SUMS.txt contains the installer checksums.
          files: release-assets/*
